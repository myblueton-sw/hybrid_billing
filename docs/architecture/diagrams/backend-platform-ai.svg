</g><rect x="234" y="110" width="1070" height="122" rx="8" class="store" /><text x="254" y="141" class="header">API Gateway / Unified External Entry</text><text x="254" y="169" class="label">TLS / Credential validation / Quotas / Versioned routing / Request tracing</text><text x="254" y="196" class="label">Common OpenAPI contracts / Stable errors / Idempotency semantics / Redundant instances</text><text x="1284" y="217" class="muted" text-anchor="end">Gateway product unselected; domain authorization remains downstream</text><text x="252" y="258" class="muted">Public ingress only. Provider pulls / ERP dispatch / IdP verification use separately governed outbound adapters.</text><path d="M168 390H190V148H234" class="edge" marker-end="url(#arrow)" /><path d="M168 535H197V173H234" class="edge" marker-end="url(#arrow)" /><path d="M168 683H204V197H234" class="edge" marker-end="url(#arrow)" /><path d="M168 900H188V216H234" class="edge control" marker-end="url(#arrow)" /><path d="M1374 387H1347V153H1304" class="edge" marker-end="url(#arrow)" /><path d="M234 184H222V394H252" class="edge" marker-end="url(#arrow)" /><path d="M1304 176H1321V393H1286" class="edge" marker-end="url(#arrow)" /><path d="M1286 404H1356V527H1374" class="edge control" marker-end="url(#arrow)" /><path d="M252 423H214V426H168" class="edge control" marker-end="url(#arrow)" /></svg>