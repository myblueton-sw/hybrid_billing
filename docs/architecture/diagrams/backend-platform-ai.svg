<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1565" viewBox="0 0 1560 1565" role="img" aria-labelledby="title desc"><title id="title">Hybrid Billing backend solution architecture</title><desc id="desc">Collection and messaging, processing engines and backend applications are separated from three parallel data stores: object storage, ClickHouse OLAP database, and PostgreSQL transactional database. Parquet files live in object storage. Iceberg and a catalog manage table snapshots and metadata. A shared AI analysis and RAG system integrates both collector evidence-reference triggers and backend requests, with derived retrieval index, embedding worker, governed read-only tools, and isolated model gateway. Shared monitoring and security apply to the entire platform.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#667d96" /></marker></defs><style>
