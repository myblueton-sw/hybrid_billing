<text x="105" y="850.76" font-family="Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="600" fill="#182230">Your document history</text>
<text x="110" y="880.76" font-family="Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="400" fill="#182230">This is the issued r8 view. Earlier internal drafts are not customer documents.</text>
<text x="110" y="916.04" font-family="Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="400" fill="#526174">If an issued amount changes, show a linked correction and explanation; preserve the original invoice.</text>
<text x="85" y="995.04" font-family="Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="400" fill="#526174">Synthetic later-stage example: 1,200 - 120 + 20 = 1,100 net; illustrative 10% tax = 110; gross = 1,210.</text>
<text x="85" y="1028.04" font-family="Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="400" fill="#526174">No real invoice, payment, tax policy, download, customer account or authentication is created.</text>
<text x="85" y="1060.18" font-family="Apple SD Gothic Neo, sans-serif" font-size="13" font-weight="400" fill="#526174">C01 + C02 + C03  /  No supplier costs, MSP margin, internal correction cases or raw-source links.</text>
